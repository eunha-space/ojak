[tools.rust]
version = "1.95.0"
profile = "default"
components = "rust-analyzer,rustfmt,clippy"
# A target with no standard library, which the no_std crates are built for.
targets = "thumbv7em-none-eabihf"

[tools.node]
version = "24"

[tools."github:dahlia/hongdown"]
version = "0.3.11"

[tools."github:dahlia/hongdown".platforms]
linux-x64 = "hongdown-*-x86_64-unknown-linux-musl.tar.bz2"
linux-arm64 = "hongdown-*-aarch64-unknown-linux-musl.tar.bz2"

[tasks.check]
description = "Run type check, lint, and check Markdown format"
run = [
  "cargo check",
  # The host always has std, so only a target without one shows that these
  # still build without it.
  "cargo check -p ojak-vocab -p ojak-jsonld --target thumbv7em-none-eabihf",
  "cargo clippy",
  "cargo fmt --check",
  "hongdown --check",
  "mise fmt --check",
]

[tasks.fmt]
description = "Format code and docs"
run = ["cargo fmt", "hongdown --write", "mise fmt"]

[tasks."docs:install"]
description = "Install the documentation website's dependencies"
dir = "docs"
run = "npm ci"

[tasks."docs:dev"]
description = "Serve the documentation website locally"
dir = "docs"
depends = ["docs:install"]
run = "npm run dev"

[tasks."docs:build"]
description = "Build the documentation website"
dir = "docs"
depends = ["docs:install"]
run = "npm run build"
