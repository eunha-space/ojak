[package]
name = "ojak-example-blog"
description = "A blog that federates, built with Ojak: the example the tutorial walks through"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ojak = { path = "../../crates/ojak" }
ojak-axum = { path = "../../crates/ojak-axum" }
ojak-vocab = { path = "../../crates/ojak-vocab" }
axum = "0.8"
chrono.workspace = true
minijinja = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
url.workspace = true

[dev-dependencies]
http = "1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
