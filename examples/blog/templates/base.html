<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ blog_title }}{% endblock %}</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem;
           font: 1.1rem/1.6 system-ui, sans-serif; }
    header a { color: inherit; text-decoration: none; font-weight: bold; }
    small { color: #777; }
    input, textarea { width: 100%; font: inherit; }
  </style>
</head>
<body>
  <header><a href="/">{{ blog_title }}</a></header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
