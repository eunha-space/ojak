[package]
name = "feder"
description = "An ActivityPub application framework over feder's protocol crates"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
feder-core = { path = "../feder-core" }
feder-runtime = { path = "../feder-runtime" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ipnet = "2"
reqwest.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
url.workspace = true

[features]
# The checks every queue backend has to pass, for backends' own tests.
testing = []

[dev-dependencies]
axum = "0.8"
reqwest.workspace = true
feder-runtime = { path = "../feder-runtime" }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "memory_queue"
required-features = ["testing"]

[[test]]
name = "memory_kv"
required-features = ["testing"]
