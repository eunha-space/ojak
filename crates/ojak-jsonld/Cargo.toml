[package]
name = "ojak-jsonld"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iri-string.workspace = true
# Not inherited from the workspace: this crate is `no_std`, and an inherited
# dependency cannot turn the workspace's default features back off.
# `float_roundtrip`: a number must parse to the double its text names, or
# its canonical RDF form (`rdf`) is one digit off what its signer hashed.
serde_json = { version = "1.0.140", default-features = false, features = ["alloc", "float_roundtrip"] }

# The canonical form's blank-node labels are SHA-256 hashes (`rdf`).
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true

[dev-dependencies]
# Tests are ordinary `std` code; the library itself is checked `no_std` by
# building it for a target without one, in `mise run check`.
serde_json.workspace = true
