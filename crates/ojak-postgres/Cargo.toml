[package]
name = "ojak-postgres"
description = "PostgreSQL queue and key-value backends for ojak"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ojak = { path = "../ojak" }
serde_json.workspace = true
# The runtime without a TLS backend: an application's own sqlx features add
# the one it connects with, and Cargo unifies them.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "json", "runtime-tokio"] }

[dev-dependencies]
ojak = { path = "../ojak", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
