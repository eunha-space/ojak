[package]
name = "ojak"
description = "An ActivityPub application framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ojak-jsonld.workspace = true
ojak-sig.workspace = true
ojak-vocab = { path = "../ojak-vocab" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
ipnet = "2"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
url.workspace = true

[features]
# The checks every queue backend has to pass, for backends' own tests.
testing = []

[dev-dependencies]
chrono.workspace = true
http = "1"
axum = "0.8"
reqwest.workspace = true
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "memory_queue"
required-features = ["testing"]

[[test]]
name = "memory_kv"
required-features = ["testing"]
