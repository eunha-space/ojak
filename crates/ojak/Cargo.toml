[package]
name = "ojak"
description = "An ActivityPub application framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ojak-jsonld.workspace = true
ojak-sig.workspace = true
ojak-vocab = { path = "../ojak-vocab" }
anyhow.workspace = true
base64.workspace = true
bs58.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
ipnet = "2"
percent-encoding = "2"
# The system's randomness, for the keys ojak makes itself.
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"
reqwest.workspace = true
# host-meta, the XRD a host that does not answer WebFinger points to it with.
roxmltree = "0.21"
# Reads the page a URL serves for the link to its ActivityPub object.
scraper = { version = "0.27", optional = true }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "macros"] }
url.workspace = true

[features]
default = ["html"]
# Finding the ActivityPub object a web page links to
# (`fetch::html_alternate`).
html = ["dep:scraper"]
# The checks every queue backend has to pass, for backends' own tests, and
# another server to federate with in an application's tests.
testing = []

[dev-dependencies]
chrono.workspace = true
http = "1"
axum = "0.8"
reqwest.workspace = true
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "memory_queue"
required-features = ["testing"]

[[test]]
name = "memory_kv"
required-features = ["testing"]

[[test]]
name = "remote"
required-features = ["testing"]
