# Feder's additions to the vocabulary: properties the fediverse sends that the
# vendored schemas in ../schemas do not describe; types they do not describe
# are in types/, in the same format as the schemas. Those stay byte-for-byte
# Fedify's; what is here is Feder's, merged into the types it names when
# feder-vocab-gen generates them. Each property is in the format of
# ../schemas/format/schema.yaml, and each is here because a document in
# tests/corpus carries it.
#
# A term added here also needs a term in Feder's context
# (crates/feder-jsonld/contexts/feder.jsonld) to be read by that name.

additions:

# ActivityPub's client-to-server endpoint for media, which Pleroma and
# Akkoma publish.
- to:
  - "https://www.w3.org/ns/activitystreams#Endpoints"
  properties:
  - singularName: uploadMedia
    functional: true
    compactName: uploadMedia
    uri: "https://www.w3.org/ns/activitystreams#uploadMedia"
    description: |
      Where a client uploads media, as ActivityPub's client-to-server protocol
      describes.
    range:
    - "http://www.w3.org/2001/XMLSchema#anyURI"

# Mastodon's media attributes, on every image, video and audio attachment.
- to:
  - "https://www.w3.org/ns/activitystreams#Document"
  properties:
  - singularName: blurhash
    functional: true
    compactName: blurhash
    uri: "http://joinmastodon.org/ns#blurhash"
    description: |
      A BlurHash of the media, drawn while it loads.
    range:
    - "http://www.w3.org/2001/XMLSchema#string"
  - singularName: focalPointCoordinate
    pluralName: focalPoint
    compactName: focalPoint
    uri: "http://joinmastodon.org/ns#focalPoint"
    container: list
    description: |
      The point a crop of the media keeps in view, as x and y from -1 to 1.
    range:
    - "http://www.w3.org/2001/XMLSchema#float"

# FEP-2c59: the handle an actor is found by, so that a server does not have
# to guess it from the actor's host.
- to:
  - "https://www.w3.org/ns/activitystreams#Application"
  - "https://www.w3.org/ns/activitystreams#Group"
  - "https://www.w3.org/ns/activitystreams#Organization"
  - "https://www.w3.org/ns/activitystreams#Person"
  - "https://www.w3.org/ns/activitystreams#Service"
  properties:
  - singularName: webfinger
    functional: true
    compactName: webfinger
    uri: "https://purl.archive.org/socialweb/webfinger#webfinger"
    description: |
      The actor's WebFinger handle, `user@host` (FEP-2c59).
    range:
    - "http://www.w3.org/2001/XMLSchema#string"

# Lemmy's communities.
- to:
  - "https://www.w3.org/ns/activitystreams#Group"
  properties:
  - singularName: postingRestrictedToMods
    functional: true
    compactName: postingRestrictedToMods
    uri: "https://join-lemmy.org/ns#postingRestrictedToMods"
    description: |
      Whether only the community's moderators may post in it.
    range:
    - "http://www.w3.org/2001/XMLSchema#boolean"
  - singularName: moderators
    functional: true
    compactName: moderators
    uri: "https://join-lemmy.org/ns#moderators"
    description: |
      The collection of the community's moderators.
    range:
    - "https://www.w3.org/ns/activitystreams#OrderedCollection"

- to:
  - "https://www.w3.org/ns/activitystreams#Article"
  - "https://www.w3.org/ns/activitystreams#Note"
  - "https://www.w3.org/ns/activitystreams#Page"
  - "https://www.w3.org/ns/activitystreams#Video"
  properties:
  - singularName: commentsEnabled
    functional: true
    compactName: commentsEnabled
    uri: "https://joinpeertube.org/ns#commentsEnabled"
    description: |
      Whether replies are accepted: PeerTube's term, which Lemmy sends as
      the opposite of a post being locked.
    range:
    - "http://www.w3.org/2001/XMLSchema#boolean"

- to:
  - "https://www.w3.org/ns/activitystreams#Page"
  properties:
  - singularName: stickied
    functional: true
    compactName: stickied
    uri: "https://join-lemmy.org/ns#stickied"
    description: |
      Whether the post is pinned to the top of its community.
    range:
    - "http://www.w3.org/2001/XMLSchema#boolean"

- to:
  - "https://www.w3.org/ns/activitystreams#Note"
  properties:
  - singularName: distinguished
    functional: true
    compactName: distinguished
    uri: "https://join-lemmy.org/ns#distinguished"
    description: |
      Whether a moderator marked the comment as speaking for the community.
    range:
    - "http://www.w3.org/2001/XMLSchema#boolean"

- to:
  - "https://www.w3.org/ns/activitystreams#Person"
  properties:
  - singularName: matrixUserId
    functional: true
    compactName: matrixUserId
    uri: "https://join-lemmy.org/ns#matrixUserId"
    description: |
      The person's Matrix user ID.
    range:
    - "http://www.w3.org/2001/XMLSchema#string"

- to:
  - "https://www.w3.org/ns/activitystreams#Block"
  - "https://www.w3.org/ns/activitystreams#Delete"
  properties:
  - singularName: removeData
    functional: true
    compactName: removeData
    uri: "https://join-lemmy.org/ns#removeData"
    description: |
      Whether what the blocked or deleted person posted is to be removed too.
    range:
    - "http://www.w3.org/2001/XMLSchema#boolean"

# FEP-ef61: where a portable actor's latest document can be fetched, in
# order. An actor whose id is an `ap` URI has to list at least one.
- to:
  - "https://www.w3.org/ns/activitystreams#Application"
  - "https://www.w3.org/ns/activitystreams#Group"
  - "https://www.w3.org/ns/activitystreams#Organization"
  - "https://www.w3.org/ns/activitystreams#Person"
  - "https://www.w3.org/ns/activitystreams#Service"
  properties:
  - singularName: gateway
    pluralName: gateways
    compactName: gateways
    uri: "https://w3id.org/fep/ef61/gateways"
    container: list
    description: |
      The gateways that serve the actor, as origins with no path, the first
      preferred (FEP-ef61).
    range:
    - "http://www.w3.org/2001/XMLSchema#anyURI"
